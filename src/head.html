<title>多项式的整除 · 逐题详解</title>
<style>
/* Layout: one reading column like a worked-solution notebook; steps are a real sequence, so they are numbered */
:root {
  --bg: #f7f8fa;
  --paper: #ffffff;
  --fg: #1d2430;
  --muted: #5b6577;
  --line: #d9dee7;
  --accent: #1f4e8c;      /* ink blue: headings, step numbers */
  --accent-soft: #e6eef9;
  --idea: #8a5a00;        /* "why think this way" notes */
  --idea-soft: #fbf3e2;
  --ok: #1d7a4c;
  --ok-soft: #e4f4ec;
  --cancel: #b3363b;
  --font-display: "Noto Serif SC", "Songti SC", "SimSun", serif;
  --font-body: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12161d; --paper: #1a1f28; --fg: #e3e7ee; --muted: #9aa4b5; --line: #2f3746;
    --accent: #8fb6ef; --accent-soft: #1d2a3d; --idea: #e7b75e; --idea-soft: #2b2416;
    --ok: #6fd1a0; --ok-soft: #17291f; --cancel: #f08a8e; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12161d; --paper: #1a1f28; --fg: #e3e7ee; --muted: #9aa4b5; --line: #2f3746;
  --accent: #8fb6ef; --accent-soft: #1d2a3d; --idea: #e7b75e; --idea-soft: #2b2416;
  --ok: #6fd1a0; --ok-soft: #17291f; --cancel: #f08a8e; color-scheme: dark;
}
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 16px; line-height: 1.85;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 32px 64px;
}
main { max-width: 760px; margin: 0 auto; display: grid; gap: 40px; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; line-height: 1.35; margin: 0; }
h1 { font-size: 1.9rem; font-weight: 900; }
h2 { font-size: 1.5rem; color: var(--accent); }
h3 { font-size: 1.12rem; }
p { margin: 0; }
.eyebrow { font-size: .8rem; letter-spacing: .12em; color: var(--muted); }
header { display: grid; gap: 10px; }
header p { color: var(--muted); }

.card { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 22px 22px; display: grid; gap: 14px; min-width: 0; }
.problem { border-left: 4px solid var(--accent); }
.problem .tag { font-size: .8rem; color: var(--muted); }

section.example { display: grid; gap: 22px; }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 26px; counter-reset: s; }
.steps > li { display: grid; grid-template-columns: 34px 1fr; gap: 14px; }
.steps > li::before {
  counter-increment: s; content: counter(s);
  width: 30px; height: 30px; border-radius: 50%;
  background: var(--accent); color: var(--paper);
  display: grid; place-items: center; font-weight: 700; font-size: .95rem; margin-top: 2px;
}
.steps > li.zero::before { content: "0"; counter-increment: none; background: var(--muted); }
.step-body { display: grid; gap: 10px; min-width: 0; }

.idea, .check, .pre { border-radius: 8px; padding: 12px 16px; display: grid; gap: 6px; }
.idea { background: var(--idea-soft); }
.idea b:first-child { color: var(--idea); }
.check { background: var(--ok-soft); }
.check b:first-child { color: var(--ok); }
.pre { background: var(--accent-soft); }
.pre b:first-child { color: var(--accent); }

.scroll { overflow-x: auto; }
mjx-container[display="true"] { overflow-x: auto; overflow-y: hidden; padding-block: 4px; }

table { border-collapse: collapse; font-size: .95rem; min-width: 100%; }
th, td { border: 1px solid var(--line); padding: 6px 12px; text-align: center; white-space: nowrap; }
th { background: var(--accent-soft); font-weight: 500; }
td.hl { background: var(--idea-soft); }

/* cancellation grid */
.cancel-grid { display: grid; grid-template-columns: 70px repeat(4, minmax(70px, 1fr)); gap: 6px; min-width: 420px; align-items: center; }
.cancel-grid .lab { color: var(--muted); font-size: .85rem; text-align: right; padding-right: 6px; }
.cancel-grid .cell { border: 1px solid var(--line); border-radius: 6px; text-align: center; padding: 6px 4px; position: relative; background: var(--paper); }
.cancel-grid .cell.x { color: var(--muted); border-color: var(--cancel); }
.cancel-grid .cell.x::after { content: ""; position: absolute; left: 8%; right: 8%; top: 50%; border-top: 2px solid var(--cancel); transform: rotate(-12deg); }
.cancel-grid .cell.keep { border: 2px solid var(--ok); }
.cancel-grid .empty { visibility: hidden; }
.cancel-grid .sum { grid-column: 2 / -1; text-align: center; border-top: 2px solid var(--fg); padding-top: 6px; }

figure { margin: 0; display: grid; gap: 8px; }
figcaption { font-size: .9rem; color: var(--muted); }
svg text { font-family: var(--font-body); }
.sv-line { stroke: var(--fg); fill: none; }
.sv-faint { stroke: var(--line); fill: none; }
.sv-acc { stroke: var(--accent); fill: none; }
.sv-idea { stroke: var(--idea); fill: none; }
.sv-dot { fill: var(--accent); }
.sv-txt { fill: var(--fg); font-size: 14px; }
.sv-muted { fill: var(--muted); font-size: 12px; }
.sv-acc-txt { fill: var(--accent); font-size: 14px; font-weight: 700; }
.sv-idea-txt { fill: var(--idea); font-size: 13px; font-weight: 700; }

details { border: 1px dashed var(--line); border-radius: 8px; padding: 10px 16px; }
summary { cursor: pointer; color: var(--muted); }
summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
details[open] summary { margin-bottom: 8px; }

.summary-box { border-top: 2px solid var(--accent); padding-top: 14px; display: grid; gap: 8px; }
ul.tight { margin: 0; padding-left: 1.3em; display: grid; gap: 4px; }
hr { border: 0; border-top: 1px solid var(--line); margin: 0; }

@media (max-width: 480px) {
  body { font-size: 15px; }
  h1 { font-size: 1.55rem; }
  .card { padding: 16px; }
  .steps > li { grid-template-columns: 28px 1fr; gap: 10px; }
  .steps > li::before { width: 26px; height: 26px; font-size: .85rem; }
}
/* added for 1.3–1.14 */
.toc { display: flex; flex-wrap: wrap; gap: 8px; }
.toc a { border: 1px solid var(--line); border-radius: 6px; padding: 2px 12px; text-decoration: none; color: var(--accent); background: var(--paper); font-variant-numeric: tabular-nums; }
.toc a:hover, .toc a:focus-visible { background: var(--accent-soft); outline: none; }
.back { font-size: .85rem; color: var(--muted); }
.back a { color: var(--muted); }
table.synth td { min-width: 44px; font-variant-numeric: tabular-nums; }
table.synth td.root { color: var(--idea); font-weight: 700; border-right: 2px solid var(--fg); }
table.synth tr.out td { border-top: 2px solid var(--fg); font-weight: 700; }
table.synth td.rem { background: var(--ok-soft); }
table.synth td.blank { border: 0; }
td.r0 { background: var(--accent-soft); } td.r1 { background: var(--idea-soft); } td.r2 { background: var(--ok-soft); }
td.left { text-align: left; }

/* figures generated by tools/figs.js */
.fg-box{fill:var(--paper);stroke:var(--muted);stroke-width:1.2}
.fg-a{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.5}
.fg-b{fill:var(--idea-soft);stroke:var(--idea);stroke-width:1.5}
.fg-c{fill:var(--ok-soft);stroke:var(--ok);stroke-width:1.5}
.fg-d{fill:var(--paper);stroke:var(--cancel);stroke-width:1.5}
.fg-ln{stroke:var(--fg);fill:none;stroke-width:1.2}
.fg-cv{fill:none;stroke:var(--accent);stroke-width:2.2}
.fg-cv2{fill:none;stroke:var(--idea);stroke-width:2.2;stroke-dasharray:6 4}
.fg-cv3{fill:none;stroke:var(--ok);stroke-width:2.2}
.fg-cv4{fill:none;stroke:var(--cancel);stroke-width:2.2}
.fg-grid{stroke:var(--line);stroke-width:1;fill:none}
.fg-dot{fill:var(--cancel)}
.fg-dot2{fill:var(--accent)}
.fg-txt{fill:var(--fg);font-size:14px}
.fg-sm{fill:var(--muted);font-size:12px}
.fg-ac{fill:var(--accent);font-size:14px;font-weight:700}
figure.fg svg text{font-family:var(--font-body)}
figure.fg{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px}
figure.fg figcaption{text-align:center}
.step-body{min-width:0}
.step-body p,.card p{overflow-x:auto;overflow-y:hidden}
.steps > li{grid-template-columns:34px minmax(0,1fr)}
main{grid-template-columns:minmax(0,1fr)}
section.example{grid-template-columns:minmax(0,1fr)}
ul.tight{overflow-x:auto;overflow-y:hidden}
</style>
