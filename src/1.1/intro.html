    <b>先弄懂一个词：“整除”是什么意思？</b>
    <p>$A \mid B$ 读作“$A$ 整除 $B$”，意思是：<b>$B$ 可以写成 $A$ 乘以某个多项式</b>，即 $B = A\cdot Q$。</p>
    <p>例如 $x^2 \mid x^3 + x^2$，因为 $x^3+x^2 = x^2\cdot(x+1)$，这里 $Q = x+1$。</p>
    <p>所以要证明“$A$ 整除 $B$”，最直接的办法就是：<b>把 $B$ 硬算成“$A\times$ 某个东西”的样子</b>。下面两题都是这个思路。</p>
  </div>
